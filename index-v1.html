<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Generator Kiosk — USB Camera Integrated</title>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 20px; }
        
        .header { background: #0f172a; color: #fff; padding: 18px 24px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .status-badge { background: #22c55e; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        .container { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card-panel { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-top: 14px; margin-bottom: 6px; }
        input[type="file"], input[type="text"], select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input[type="text"]:focus, select:focus { border-color: #2563eb; ring: 2px #2563eb; }

        .cam-controls { display: flex; gap: 8px; }
        .btn-refresh { background: #4b5563; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-refresh:hover { background: #374151; }

        .student-list { max-height: 200px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; margin-top: 8px; }
        .student-item { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.15s; }
        .student-item:hover { background: #eff6ff; }
        .student-item.selected { background: #2563eb; color: #ffffff; font-weight: 600; }

        .video-container { position: relative; width: 100%; height: 340px; background: #000; border-radius: 12px; overflow: hidden; margin-top: 10px; }
        #webcamVideo { width: 100%; height: 100%; object-fit: cover; }
        .crop-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; border: 2px dashed rgba(255, 255, 255, 0.85); border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); }

        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: 0.2s; }
        .btn-snap { background: #16a34a; color: white; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); }
        .btn-snap:hover { background: #15803d; }
        .btn-snap:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; }
        .btn-zip { background: #2563eb; color: white; display: none; }
        .btn-zip:hover { background: #1d4ed8; }

        .preview-box { width: 280px; height: 442px; border: 2px dashed #d1d5db; border-radius: 12px; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: #fafafa; overflow: hidden; }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; }

        .badge-status { font-size: 11px; padding: 3px 8px; border-radius: 12px; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-done { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="header">
    <h1>📸 KIOSK ID CARD — SONY A7 & USB CAMERA</h1>
    <span class="status-badge" id="systemStatus">Siap Digunakan</span>
</div>

<div class="container">

    <div class="card-panel">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label>1. Unggah Database (Excel/CSV):</label>
                <input type="file" id="excelInput" accept=".xlsx, .xls, .csv">
            </div>
            <div>
                <label>2. Unggah Template ID Card:</label>
                <input type="file" id="templateInput" accept="image/*">
            </div>
        </div>

        <label>3. Pilih Input Kamera USB / Sony A7:</label>
        <div class="cam-controls">
            <select id="cameraSelect" onchange="switchCamera()"></select>
            <button class="btn-refresh" onclick="initCameras()" title="Pindai Ulang Kamera">🔄 Pindai</button>
        </div>

        <label>4. Cari Nama atau NIK / NPP:</label>
        <input type="text" id="searchBox" placeholder="Ketik nama atau NIK..." onkeyup="filterData()">

        <div class="student-list" id="studentList">
            <div style="padding:15px; color:#9ca3af; text-align:center; font-size:13px;">Belum ada data. Silakan unggah file Excel/CSV.</div>
        </div>

        <label>5. Live Feed Kamera (Posisikan Wajah dalam Lingkaran):</label>
        <div class="video-container">
            <video id="webcamVideo" autoplay playsinline></video>
            <div class="crop-guide"></div>
        </div>

        <button class="btn-action btn-snap" id="btnSnap" onclick="captureAndGenerate()" disabled>📸 JEPRET & BUAT ID CARD</button>
    </div>

    <div class="card-panel" style="text-align: center;">
        <h3 style="margin-top:0;">Preview Hasil ID Card</h3>
        <div id="activeInfo" style="font-size:14px; color:#4b5563; min-height:40px;">Pilih data karyawan/siswa di sebelah kiri</div>

        <div class="preview-box" id="cardPreview">
            <span style="color:#9ca3af; font-size:13px;">Hasil ID Card akan tampil di sini</span>
        </div>

        <button class="btn-action btn-zip" id="btnZip" onclick="downloadAllZip()">💾 Unduh Semua Kartu (.ZIP)</button>
    </div>

</div>

<canvas id="photoCanvas" style="display:none;"></canvas>
<canvas id="cardCanvas" width="570" height="900" style="display:none;"></canvas>
<canvas id="barcodeCanvas" width="350" height="100" style="display:none;"></canvas>

<script>
let siswaData = [];
let selectedSiswa = null;
let generatedCards = {};
let currentStream = null;
let templateSrc = null;

// === 1. MENDETEKSI & MEMUAT KAMERA USB ===
async function initCameras() {
    const camSelect = document.getElementById('cameraSelect');
    camSelect.innerHTML = "<option>Memindai kamera USB...</option>";

    try {
        // Minta izin akses kamera awal
        const initialStream = await navigator.mediaDevices.getUserMedia({ video: true });
        initialStream.getTracks().forEach(track => track.stop()); // Tutup stream sementara

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        camSelect.innerHTML = "";

        if (videoDevices.length === 0) {
            camSelect.innerHTML = "<option value=''>⚠️ Kamera USB tidak ditemukan</option>";
            return;
        }

        videoDevices.forEach((device, index) => {
            const opt = document.createElement('option');
            opt.value = device.deviceId;
            opt.textContent = device.label || `Kamera USB ${index + 1}`;
            camSelect.appendChild(opt);
        });

        // Jalankan kamera pertama secara otomatis
        switchCamera();

    } catch (err) {
        console.error("Camera Access Error:", err);
        alert("⚠️ Gagal mengakses kamera!\n\n1. Pastikan aplikasi 'Sony Remote' sudah DITUTUP TOTAL.\n2. Berikan izin akses kamera pada browser.\n3. Jalankan aplikasi via Localhost/GitHub Pages (HTTPS).");
        camSelect.innerHTML = "<option value=''>⚠️ Akses Kamera Ditolak</option>";
    }
}

// === 2. MENGGANTI STREAM KAMERA TERPILIH ===
async function switchCamera() {
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
    }

    const deviceId = document.getElementById('cameraSelect').value;
    if (!deviceId) return;

    const constraints = {
        video: {
            deviceId: { exact: deviceId },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        }
    };

    try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('webcamVideo');
        video.srcObject = currentStream;
        document.getElementById('systemStatus').textContent = "Kamera Terhubung";
    } catch (err) {
        console.error("Error switching camera:", err);
        alert("Gagal membuka kamera ini. Kemungkinan kamera terikat oleh aplikasi lain.");
    }
}

// === 3. BACA FILE EXCEL / CSV DATABASE ===
document.getElementById('excelInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = evt => {
        const wb = XLSX.read(evt.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

        siswaData = rows.map(r => ({
            nik: r[0] ? String(r[0]).trim() : '',
            nama: r[1] ? String(r[1]).trim() : '',
            unit: r[2] ? String(r[2]).trim() : '',
            status: 'pending'
        })).filter(r => r.nik || r.nama);

        // Abaikan Baris Header jika ada
        if (siswaData.length > 0 && (siswaData[0].nik.toUpperCase().includes('NIK') || siswaData[0].nik.toUpperCase().includes('NO'))) {
            siswaData.shift();
        }

        renderSiswaList(siswaData);
    };
    reader.readAsBinaryString(file);
});

// === 4. BACA TEMPLATE BACKGROUND ===
document.getElementById('templateInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) templateSrc = URL.createObjectURL(file);
});

function renderSiswaList(list) {
    const container = document.getElementById('studentList');
    container.innerHTML = "";

    if (list.length === 0) {
        container.innerHTML = `<div style="padding:15px; color:#9ca3af; text-align:center; font-size:13px;">Data tidak ditemukan.</div>`;
        return;
    }

    list.forEach(s => {
        const div = document.createElement('div');
        div.className = `student-item ${selectedSiswa && selectedSiswa.nik === s.nik ? 'selected' : ''}`;
        div.onclick = () => selectSiswa(s);

        const badgeClass = s.status === 'done' ? 'badge-done' : 'badge-pending';
        const badgeText = s.status === 'done' ? '✅ Selesai' : '⏳ Belum';

        div.innerHTML = `
            <span><b>${s.nik}</b> — ${s.nama}</span>
            <span class="badge-status ${badgeClass}">${badgeText}</span>
        `;
        container.appendChild(div);
    });
}

function filterData() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const filtered = siswaData.filter(s => s.nama.toLowerCase().includes(q) || s.nik.toLowerCase().includes(q));
    renderSiswaList(filtered);
}

function selectSiswa(s) {
    selectedSiswa = s;
    document.getElementById('activeInfo').innerHTML = `
        Target Pemotretan:<br>
        <b style="font-size:16px; color:#1e3a8a;">${s.nama}</b><br>
        <span style="font-size:13px; color:#6b7280;">NIK: ${s.nik} ${s.unit ? '| Unit: ' + s.unit : ''}</span>
    `;
    document.getElementById('btnSnap').disabled = false;
    renderSiswaList(siswaData);
}

// === 5. JEPRET FOTO & GENERATE ID CARD ===
function captureAndGenerate() {
    if (!selectedSiswa) return;

    const video = document.getElementById('webcamVideo');
    const photoCanvas = document.getElementById('photoCanvas');
    const pCtx = photoCanvas.getContext('2d');

    // Tangkap gambar dari stream kamera USB
    photoCanvas.width = video.videoWidth || 1280;
    photoCanvas.height = video.videoHeight || 720;
    pCtx.drawImage(video, 0, 0);
    const photoSrc = photoCanvas.toDataURL('image/png');

    // Canvas utama ID Card (Ukuran Standar Pro: 570 x 900 px)
    const cardCanvas = document.getElementById('cardCanvas');
    const ctx = cardCanvas.getContext('2d');
    ctx.clearRect(0, 0, 570, 900);

    const renderCard = (bgImg) => {
        if (bgImg) {
            ctx.drawImage(bgImg, 0, 0, 570, 900);
        } else {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, 570, 900);
        }

        const photoImg = new Image();
        photoImg.src = photoSrc;
        photoImg.onload = () => {
            // PARAMETER CROP WAKTU & WAJAH (LINGKARAN PRESISI)
            const size = 280;
            const radius = size / 2;
            const fotoY = 250;
            const centerX = cardCanvas.width / 2;
            const centerY = fotoY + radius;

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.clip();

            let scale = Math.max(size / photoImg.width, size / photoImg.height);
            let w = photoImg.width * scale;
            let h = photoImg.height * scale;
            let imgX = centerX - (w / 2);
            let imgY = (centerY - radius) - (h * 0.05);

            ctx.drawImage(photoImg, imgX, imgY, w, h);
            ctx.restore();

            // RENDER TEXT (NAMA & NIK)
            ctx.textAlign = "center";
            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 32px Arial";
            ctx.fillText(selectedSiswa.nama.toUpperCase(), centerX, centerY + radius + 55);

            ctx.font = "24px Arial";
            ctx.fillStyle = "#475569";
            ctx.fillText("NIK: " + selectedSiswa.nik, centerX, centerY + radius + 90);

            // RENDER BARCODE CODE128
            try {
                const bc = document.getElementById('barcodeCanvas');
                JsBarcode(bc, selectedSiswa.nik, { format: "CODE128", displayValue: false, height: 60, margin: 0 });
                ctx.drawImage(bc, (cardCanvas.width - bc.width) / 2, centerY + radius + 115);
            } catch (e) {}

            // UPDATE PREVIEW DAN SIMPAN DATA
            const finalUrl = cardCanvas.toDataURL('image/png');
            generatedCards[`${selectedSiswa.nik}_${selectedSiswa.nama}.png`] = finalUrl;

            document.getElementById('cardPreview').innerHTML = `<img src="${finalUrl}">`;
            selectedSiswa.status = 'done';
            renderSiswaList(siswaData);
            document.getElementById('btnZip').style.display = 'block';

            // Reset Pencarian untuk Pemotretan Berikutnya
            document.getElementById('searchBox').value = "";
            document.getElementById('searchBox').focus();
            filterData();
        };
    };

    if (templateSrc) {
        const bg = new Image();
        bg.src = templateSrc;
        bg.onload = () => renderCard(bg);
    } else {
        renderCard(null);
    }
}

// === 6. DOWNLOAD BATCH ZIP ===
async function downloadAllZip() {
    const zip = new JSZip();
    const keys = Object.keys(generatedCards);

    if (keys.length === 0) return alert("Belum ada kartu yang dihasilkan!");

    keys.forEach(filename => {
        const base64Data = generatedCards[filename].split(',')[1];
        zip.file(filename, base64Data, { base64: true });
    });

    const content = await zip.generateAsync({ type: "blob" });
    saveAs(content, "Hasil_ID_Card_Karyawan.zip");
}

// Inisialisasi Kamera saat Halaman Dimuat
window.onload = initCameras;
</script>

</body>
</html>
